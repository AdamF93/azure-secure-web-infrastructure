name: Validate and preview Azure infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview changes or deploy infrastructure
        required: true
        default: preview
        type: choice
        options:
          - preview
          - deploy

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compile Bicep
        run: |
          set -euo pipefail
          az bicep build --file infra/main.bicep

      - name: Sign in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preview infrastructure changes
        env:
          AZURE_SSH_PUBLIC_KEY: ${{ vars.AZURE_SSH_PUBLIC_KEY }}
          AZURE_ALERT_EMAIL: ${{ secrets.AZURE_ALERT_EMAIL }}
        run: |
          set -euo pipefail

          : "${AZURE_SSH_PUBLIC_KEY:?Missing public key variable}"
          : "${AZURE_ALERT_EMAIL:?Missing alert email secret}"

          az deployment sub what-if \
            --name "preview-secure-web-${GITHUB_RUN_ID}" \
            --location germanywestcentral \
            --parameters infra/dev.bicepparam

      - name: Deploy infrastructure
        if: inputs.operation == 'deploy'
        env:
          AZURE_SSH_PUBLIC_KEY: ${{ vars.AZURE_SSH_PUBLIC_KEY }}
          AZURE_ALERT_EMAIL: ${{ secrets.AZURE_ALERT_EMAIL }}
        run: |
          set -euo pipefail

          : "${AZURE_SSH_PUBLIC_KEY:?Missing public key variable}"
          : "${AZURE_ALERT_EMAIL:?Missing alert email secret}"

          az deployment sub create \
            --name "deploy-secure-web-${GITHUB_RUN_ID}" \
            --location germanywestcentral \
            --parameters infra/dev.bicepparam \
            --query properties.provisioningState \
            --output tsv
    
      - name: Verify deployed web service and monitoring extension
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail

          resource_group="rg-secure-web-dev-gwc"
          vm_name="vm-web-secure-web-dev-gwc-01"

          public_hostname=$(az network public-ip show \
            --resource-group "$resource_group" \
            --name pip-web-secure-web-dev-gwc-01 \
            --query dnsSettings.fqdn \
            --output tsv)

          if [[ -z "$public_hostname" ]]; then
            echo "Public hostname was not returned."
            exit 1
          fi

          page_file=$(mktemp)
          trap 'rm -f "$page_file"' EXIT

          healthy=false
          for attempt in {1..12}; do
            echo "Checking HTTP, attempt $attempt of 12"

            if http_status=$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              --output "$page_file" \
              --write-out '%{http_code}' \
              "https://$public_hostname/"); then
              if [[ "$http_status" == "200" ]] &&
                grep -q 'Azure Secure Web Infrastructure' "$page_file"; then
                healthy=true
                break
              fi
            fi

            sleep 10
          done

          if [[ "$healthy" != "true" ]]; then
            echo "Website verification failed."
            exit 1
          fi

          agent_state=$(az vm extension show \
            --resource-group "$resource_group" \
            --vm-name "$vm_name" \
            --name AzureMonitorLinuxAgent \
            --query provisioningState \
            --output tsv)

          if [[ "$agent_state" != "Succeeded" ]]; then
            echo "Monitoring extension state: $agent_state"
            exit 1
          fi

          echo "Checking HTTPS, attempt $attempt of 12"