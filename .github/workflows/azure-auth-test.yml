name: Test Azure OIDC authentication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Sign in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify project Resource Group access
        shell: bash
        run: |
          set -euo pipefail
          az group show \
            --name rg-secure-web-dev-gwc \
            --query "{Name:name, Location:location, State:properties.provisioningState}" \
            --output table